name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Verify static checks
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/Test-Architecture.ps1
      - name: Generate code health report without full regression
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/Report-CodeHealth.ps1 -SkipVerification -OutputPath artifacts/code-health/ci
      - name: Run requested full regression and generate code health report
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/Report-CodeHealth.ps1 -OutputPath artifacts/code-health/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-health
          path: artifacts/code-health/ci
