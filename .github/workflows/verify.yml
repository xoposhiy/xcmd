# @implements HeadlessVerification, IntegrationVerification, QualityChecks, CodeHealth
name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Full verification
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: scripts/requirements-lint.txt
      - name: Run all tests and checks and generate the code health report
        id: verify
        run: |
          $groupOpen = $false
          pwsh -NoProfile -File ./scripts/Report-CodeHealth.ps1 -OutputPath artifacts/code-health/ci 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/verification-console.log" | ForEach-Object {
              if ("$_" -like 'CHECK *') {
                if ($groupOpen) { Write-Output '::endgroup::' }
                Write-Output ("::group::" + "$_".Substring(6))
                $groupOpen = $true
              } else { Write-Output $_ }
            }
          $status = $LASTEXITCODE
          if ($groupOpen) { Write-Output '::endgroup::' }
          exit $status
      - name: Publish the application for startup checks
        run: dotnet publish src/Xcmd.Desktop/Xcmd.Desktop.csproj -c Release -r win-x64 --no-self-contained -p:PublishReadyToRun=true -p:RestoreLockedMode=true --output artifacts/ci-application -m:1 -p:UseSharedCompilation=false -v minimal
      - name: Check published startup with offscreen rendering
        run: ./scripts/Test-Startup.ps1 -ApplicationPath artifacts/ci-application -OutputPath artifacts/startup/ci-headless
      - name: Check published startup with the native Windows backend
        run: ./scripts/Test-Startup.ps1 -ApplicationPath artifacts/ci-application -OutputPath artifacts/startup/ci-native -Native
      - name: Upload the report and test diagnostics
        id: diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: code-health
          path: artifacts/code-health/ci
          retention-days: 14
      - name: Show verification results in the run summary
        if: ${{ !cancelled() && steps.verify.outcome != 'skipped' }}
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DIAGNOSTICS_URL: ${{ steps.diagnostics.outputs.artifact-url }}
          PYTHONUTF8: '1'
        run: python scripts/code-health/ci_summary.py artifacts/code-health/ci "$env:RUNNER_TEMP/verification-console.log"
      - name: Upload startup results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: startup
          path: |
            artifacts/startup/ci-*/results.json
            artifacts/startup/ci-*/run-*
          retention-days: 14
      - name: Upload analyzer failure diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: architecture-diagnostics
          path: artifacts/architecture
          retention-days: 14
