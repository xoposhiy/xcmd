name: Verify

on: [push, pull_request]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Verify and generate code health report
        shell: pwsh
        run: ./scripts/Report-CodeHealth.ps1 -OutputPath artifacts/code-health/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-health
          path: artifacts/code-health/ci
